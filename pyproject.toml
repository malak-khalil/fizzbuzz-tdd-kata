[project]
name = "fizzbuzz-tdd-kata"
version = "0.1.0"
description = "A TDD kata: FizzBuzz, from notebook exploration to a tested, published package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "malak khalil", email = "malak.khalil@lau.edu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fizzbuzz_tdd_kata"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/notebooks",
    "/tests",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "marimo>=0.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks"]